<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfe8ec">
<meta name="description" content="Vinith Reddy Banda · interactive portfolio world">
<title>Vinith Reddy Banda</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe8ec;touch-action:none}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#26343b}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#dfe8ec;color:#53636b;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
#loading.hide{display:none}
#intro{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:linear-gradient(180deg,rgba(223,232,236,.96),rgba(223,232,236,.72));backdrop-filter:blur(6px);text-align:center;padding:22px}
#intro>div{max-width:460px}
#intro .mark{font-size:10px;letter-spacing:.2em;color:#74838a;text-transform:uppercase;margin-bottom:18px}
#intro h1{margin:0;font-size:clamp(64px,15vw,116px);line-height:.8;letter-spacing:-.09em;font-weight:800}
#intro p{margin:20px auto;max-width:350px;font-size:14px;line-height:1.65;color:#596970}
#start{padding:13px 22px;border:0;border-radius:999px;background:#26343b;color:#fff;font-weight:700;cursor:pointer}
#dialog{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);width:min(560px,calc(100% - 24px));padding:16px 18px;border-radius:18px;background:rgba(250,250,247,.93);backdrop-filter:blur(14px);box-shadow:0 16px 54px rgba(37,53,60,.18);display:none;z-index:12}
#dialog.show{display:block}
#speaker{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#7b8990}
#dialogText{font-size:14px;line-height:1.58;margin-top:6px;color:#2f4047}
#continue{margin-top:11px;padding:8px 13px;border-radius:999px;border:1px solid #c6d0d4;background:#fff;color:#314047;cursor:pointer}
#quest{position:fixed;right:16px;top:16px;z-index:10;width:min(290px,calc(100% - 32px));padding:12px 14px;border-radius:15px;background:rgba(250,250,247,.82);backdrop-filter:blur(12px);display:none;box-shadow:0 10px 35px rgba(42,56,62,.1)}
#quest.show{display:block}
#quest small{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#7d8a91}#quest b{display:block;margin-top:4px;font-size:13px}#quest span{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:#66767d}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:10;padding:7px 10px;border-radius:999px;background:rgba(38,52,59,.42);color:#fff;font-size:8px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
#mobile{position:fixed;left:16px;bottom:52px;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.16);backdrop-filter:blur(10px);display:none;z-index:11}
#stick{position:absolute;width:46px;height:46px;left:36px;top:36px;border-radius:50%;background:rgba(255,255,255,.62)}
@media(max-width:760px){#hint{bottom:14px}.dialog{}#mobile{display:block}}
</style>
</head>
<body>
<div id="game"></div>
<div id="loading">loading world</div>
<div id="intro"><div><div class="mark">VINITH · INTERACTIVE PORTFOLIO</div><h1>V.</h1><p>There is no scroll. Walk through the world, meet the NPCs, and discover the work one place at a time.</p><button id="start">ENTER WORLD</button></div></div>
<div id="dialog"><div id="speaker"></div><div id="dialogText"></div><button id="continue">Continue ↗</button></div>
<div id="quest"><small>discovered</small><b id="questTitle"></b><span id="questText"></span></div>
<div id="hint">WASD · MOUSE · E</div>
<div id="mobile"><div id="stick"></div></div>

<script type="module">
import*as THREE from"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const el=id=>document.getElementById(id);
const game=el("game"),loading=el("loading"),intro=el("intro"),dialog=el("dialog"),speaker=el("speaker"),dialogText=el("dialogText"),quest=el("quest"),questTitle=el("questTitle"),questText=el("questText"),mobile=el("mobile"),stick=el("stick"),hint=el("hint");

const scene=new THREE.Scene();
scene.background=new THREE.Color("#dfe8ec");
scene.fog=new THREE.Fog("#dfe8ec",18,42);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(0,5.5,12);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
game.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight("#ffffff","#718087",1.65));
const sun=new THREE.DirectionalLight("#fff2dc",2.15);sun.position.set(10,15,7);scene.add(sun);

const toon=c=>new THREE.MeshToonMaterial({color:c});
const world=new THREE.Group();
scene.add(world);

// Floating mini-island with a soft, graphic silhouette.
const island=new THREE.Mesh(new THREE.CylinderGeometry(8.6,8.95,1.2,72),toon("#879d69"));
island.position.y=-.52;
world.add(island);
const soil=new THREE.Mesh(new THREE.CylinderGeometry(8.05,8.2,.34,72),toon("#b09572"));
soil.position.y=.06;world.add(soil);

const roadMat=toon("#6e6660");
function road(x,z,w,d,r=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),roadMat);m.rotation.x=-Math.PI/2;m.rotation.z=r;m.position.set(x,.24,z);world.add(m)}
road(0,0,13,.9);road(0,0,.9,12);road(-2.8,2.4,5,.7,-.5);road(2.8,-2.4,5,.7,-.5);

const destinations=[
 {id:"care",name:"CARE SCHEDULE",x:-4.15,z:-2.95,color:"#a76755",title:"CareSchedule",body:"Full-stack scheduling system: ASP.NET Core, React, EF Core and SQL Server. 148 REST APIs, 32 controllers, 33 domain entities and six role-based workflows."},
 {id:"journal",name:"JOURNAL AI",x:4.05,z:-2.95,color:"#c69a5d",title:"JournalAI",body:"AI journaling with Next.js, Supabase and Groq AI, shipped through Docker, Kubernetes and Azure."},
 {id:"android",name:"ANDROID LAB",x:-4.05,z:2.9,color:"#ad7066",title:"Android Lab",body:"Activities for Discord uses Android, Java, C++, JNI and Discord's SDK. WhatsApp Status Saver is an open-source Kotlin Android utility."},
 {id:"research",name:"RESEARCH",x:4.05,z:2.9,color:"#8b866f",title:"Research",body:"Multi-Task Graph Attention Network for Kinematic Rehabilitation Exercise Analysis, an IEEE I3CTCON 2026 full paper."},
 {id:"archive",name:"ARCHIVE",x:0,z:4.8,color:"#977c65",title:"Archive",body:"Information Technology at CBIT, full-stack systems, developer tooling, AI, Android, open source and the story behind the projects."},
 {id:"contact",name:"CONTACT",x:0,z:-4.7,color:"#777b80",title:"Contact",body:"GitHub: github.com/vinithreddybanda · Email: vinithreddybanda@gmail.com"}
];

function label(text){
 const c=document.createElement("canvas");c.width=360;c.height=90;const x=c.getContext("2d");
 x.fillStyle="#27353be8";x.beginPath();x.roundRect(5,8,350,72,20);x.fill();x.fillStyle="#ffe2bb";x.font="700 24px system-ui";x.textAlign="center";x.textBaseline="middle";x.fillText(text,180,45);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(2.7,.68,1);return s;
}
function house(d){
 const g=new THREE.Group();g.position.set(d.x,.16,d.z);
 const b=new THREE.Mesh(new THREE.BoxGeometry(1.95,1.55,1.75),toon("#eadcca"));b.position.y=.78;g.add(b);
 const r=new THREE.Mesh(new THREE.ConeGeometry(1.5,.86,4),toon(d.color));r.position.y=2.0;r.rotation.y=Math.PI/4;g.add(r);
 const door=new THREE.Mesh(new THREE.BoxGeometry(.43,.72,.07),toon("#37434a"));door.position.set(0,.36,.92);g.add(door);
 const window=new THREE.Mesh(new THREE.BoxGeometry(.46,.46,.06),toon("#a9c6ca"));window.position.set(-.55,.9,.92);g.add(window);
 const l=label(d.name);l.position.y=3.05;g.add(l);
 world.add(g);d.object=g;
}
destinations.forEach(house);

for(let i=0;i<55;i++){
 const a=Math.random()*Math.PI*2,r=5.4+Math.random()*2.7,x=Math.cos(a)*r,z=Math.sin(a)*r;
 const g=new THREE.Group();g.position.set(x,.2,z);
 const t=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,.4,7),toon("#70513d"));t.position.y=.2;
 const c=new THREE.Mesh(new THREE.ConeGeometry(.3,.68,8),toon(i%4?"#41694d":"#577a54"));c.position.y=.68;
 g.add(t,c);world.add(g);
}

// Original NPCs, with game-style dialogue rather than overlay cards.
const npcDefs=[
 {name:"Mira",role:"Guide",x:-1.45,z:.55,color:"#d18b6c",lines:["Welcome to Vinith's world.","Every part of the portfolio is somewhere in this village.","Walk around. Talk to people. The world tells the story."]},
 {name:"Arun",role:"Engineer",x:-2.1,z:-1.1,color:"#bd755f",lines:["I look after the engineering chapter.","CareSchedule is the house down that road.","Go there and press E when you are close."]},
 {name:"Nia",role:"AI Builder",x:2.0,z:-1.12,color:"#c99f63",lines:["The AI chapter is mine.","JournalAI is the building with the warmer roof.","It connects product work, AI and cloud delivery."]},
 {name:"Kiran",role:"Android Builder",x:-2.08,z:1.62,color:"#b7736a",lines:["Not every useful project needs a giant product page.","The Android Lab holds Activities for Discord and WhatsApp Status Saver.","Explore it when you are ready."]},
 {name:"Dr. Rao",role:"Researcher",x:2.1,z:1.63,color:"#a59a7d",lines:["The research route is quieter.","The Research House tells the story of the rehabilitation paper.","There is a lot more than a title there."]},
 {name:"Ivy",role:"Archivist",x:.7,z:3.15,color:"#9c8065",lines:["The Archive keeps the timeline.","Education, technologies and the path behind the projects live there.","Nothing here should feel like a résumé pasted onto a wall."]},
 {name:"Sam",role:"Courier",x:.72,z:-3.0,color:"#85898c",lines:["The final route is simple.","The Contact house has the GitHub and email trail.","Take the route you came for."]},
];
function makeNpc(n){
 const g=new THREE.Group();g.position.set(n.x,.16,n.z);g.userData=n;
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.5,5,9),toon(n.color));body.position.y=.62;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),toon("#d49474"));head.position.y=1.06;
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.21,16,10,0,Math.PI*2,0,Math.PI*.5),toon("#25262a"));hair.position.y=1.12;
 g.add(body,head,hair);
 const l=label(n.name);l.scale.set(1.65,.43,1);l.position.y=1.72;g.add(l);
 world.add(g);return g
}
const npcs=npcDefs.map(makeNpc);

const pCount=1900,pPos=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){const a=Math.random()*Math.PI*2,r=9+Math.random()*13;pPos[i*3]=Math.cos(a)*r;pPos[i*3+1]=.2+Math.random()*6;pPos[i*3+2]=Math.sin(a)*r}
const pgeo=new THREE.BufferGeometry();pgeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
const particles=new THREE.Points(pgeo,new THREE.PointsMaterial({color:"#f2b986",size:.043,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(particles);

const player=new THREE.Group();player.position.set(0,.16,0);
const pbody=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.54,5,10),toon("#ebe6de"));pbody.position.y=.63;
const phead=new THREE.Mesh(new THREE.SphereGeometry(.22,18,14),toon("#d79874"));phead.position.y=1.15;
const phair=new THREE.Mesh(new THREE.SphereGeometry(.23,18,10,0,Math.PI*2,0,Math.PI*.52),toon("#202126"));phair.position.y=1.22;
const pbag=new THREE.Mesh(new THREE.BoxGeometry(.26,.3,.14),toon("#aa583e"));pbag.position.set(.31,.73,-.08);
player.add(pbody,phead,phair,pbag);world.add(player);

const content=new Map(destinations.map(d=>[d.id,d]));
const state={started:false,yaw:0,pitch:.2,npc:null,dialogIndex:0,near:null,discovered:new Set()};

function openNpc(n){state.npc=n;state.dialogIndex=0;speaker.textContent=n.role+" · "+n.name;dialogText.textContent=n.lines[0];dialog.classList.add("show");hint.style.opacity=".25"}
el("continue").onclick=()=>{if(!state.npc)return;state.dialogIndex++;if(state.dialogIndex>=state.npc.lines.length){state.npc=null;dialog.classList.remove("show");hint.style.opacity=".72"}else dialogText.textContent=state.npc.lines[state.dialogIndex]};

function discover(d){state.discovered.add(d.id);questTitle.textContent=d.title;questText.textContent=d.body;quest.classList.add("show");setTimeout(()=>quest.classList.remove("show"),7200)}

function interact(){
 const p=player.position;let nBest=null,nDist=1.35;
 for(const n of npcs){const d=n.position.distanceTo(p);if(d<nDist){nDist=d;nBest=n}}
 if(nBest){openNpc(nBest.userData);return}
 let best=null,bd=1.7;
 for(const d of destinations){const q=Math.hypot(d.x-p.x,d.z-p.z);if(q<bd){bd=q;best=d}}
 if(best)discover(best)
}

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="e")interact();if(e.key==="Enter"&&!state.started)startGame()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let dragging=false,lastX=0,lastY=0;
addEventListener("mousedown",e=>{if(state.started&&!dialog.classList.contains("show")){dragging=true;lastX=e.clientX;lastY=e.clientY}});
addEventListener("mouseup",()=>dragging=false);
addEventListener("mousemove",e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;state.yaw-=dx*.005;state.pitch=THREE.MathUtils.clamp(state.pitch-dy*.004,-.18,.7)});

const joy={x:0,y:0};
function moveJoy(t){const r=mobile.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy,l=Math.hypot(dx,dy),m=40;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;stick.style.transform=`translate(${dx}px,${dy}px)`}
mobile.addEventListener("touchstart",e=>moveJoy(e.touches[0]),{passive:true});mobile.addEventListener("touchmove",e=>moveJoy(e.touches[0]),{passive:true});mobile.addEventListener("touchend",()=>{joy.x=0;joy.y=0;stick.style.transform="translate(0,0)"},{passive:true});

function startGame(){state.started=true;intro.style.display="none";loading.classList.add("hide");hint.textContent=matchMedia("(max-width:760px)").matches?"JOYSTICK · TOUCH · E":"WASD · MOUSE · E";openNpc(npcs[0].userData)}

let last=performance.now();
function loop(now){
 const dt=Math.min((now-last)/1000,.033);last=now;
 if(state.started&&!state.npc){
  let dx=0,dz=0;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;dx+=joy.x;dz+=joy.y;
  if(dx||dz){const l=Math.hypot(dx,dz);dx/=l;dz/=l;const c=Math.cos(state.yaw),s=Math.sin(state.yaw),mx=dx*c-dz*s,mz=dx*s+dz*c;player.position.x=THREE.MathUtils.clamp(player.position.x+mx*dt*2.2,-6.4,6.4);player.position.z=THREE.MathUtils.clamp(player.position.z+mz*dt*2.2,-6.4,6.4);player.rotation.y=Math.atan2(mx,mz);pbody.rotation.z=Math.sin(now*.01)*.035}else pbody.position.y=.63+Math.sin(now*.002)*.015;
 }
 for(let i=0;i<npcs.length;i++){npcs[i].position.y=.16+Math.sin(now*.0011+i)*.02;npcs[i].rotation.y=Math.sin(now*.00019+i)*.14}
 particles.rotation.y+=dt*.006;
 const target=new THREE.Vector3(player.position.x,1.0,player.position.z);
 const desired=new THREE.Vector3(player.position.x+Math.sin(state.yaw)*7.9,player.position.y+3.8-state.pitch,player.position.z+Math.cos(state.yaw)*7.9);
 camera.position.lerp(desired,.065);camera.lookAt(target);
 let near=null,nd=1.35;
 for(const n of npcs){const d=n.position.distanceTo(player.position);if(d<nd){nd=d;near=n.userData}}
 if(near!==state.near){state.near=near;if(near&&!dialog.classList.contains("show")){hint.textContent="E · TALK TO "+near.name.toUpperCase();hint.style.opacity=".82"}else{hint.textContent="WASD · MOUSE · E";hint.style.opacity=".72"}}
 renderer.render(scene,camera);requestAnimationFrame(loop)
}
loading.classList.add("hide");renderer.render(scene,camera);requestAnimationFrame(loop);
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script>
</body>
</html>
