<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<meta name="description" content="Vinith Reddy Banda · interactive developer portfolio">
<title>Vinith Reddy Banda</title>
<style>
#tip{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);padding:9px 12px;border-radius:999px;background:rgba(7,9,12,.58);backdrop-filter:blur(14px);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#ddd;opacity:0;pointer-events:none;transition:opacity .25s;z-index:12}.minimal-ui{position:fixed;top:16px;left:16px;z-index:12;display:flex;align-items:center;gap:11px;pointer-events:none}.brand{font-size:11px;font-weight:800;letter-spacing:.16em}.coords{font-size:8px;letter-spacing:.13em;color:#777c85}.interaction{position:fixed;top:16px;right:16px;z-index:12;font-size:8px;letter-spacing:.14em;color:#777c85;text-transform:uppercase}
:root{color-scheme:dark;--bg:#090b0f;--fg:#f6f3ed;--muted:#9b9ca4;--glass:rgba(18,20,25,.66);--line:rgba(255,255,255,.08);--orange:#ff6b2c;--gold:#ffb45a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,a{font:inherit}
a{color:inherit}
#world{position:fixed;inset:0;z-index:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#ui{position:relative;z-index:2}
.hud{position:fixed;left:16px;top:16px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(11,13,18,.58);backdrop-filter:blur(18px);display:flex;align-items:center;gap:9px;box-shadow:0 10px 40px rgba(0,0,0,.18)}


</style>
</head>
<body>
<div id="world"></div>
<div id="ui">
 <div class="minimal-ui"><div class="brand">VINITH</div><div class="coords" id="coords">SECTOR 01 · 00:00</div></div>
 <div id="tip">E · INTERACT</div>
</div>

<script type="module">
import*as THREE from"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const world=document.getElementById("world");
const tip=document.getElementById("tip");
const coords=document.getElementById("coords");

const scene=new THREE.Scene();
scene.background=new THREE.Color("#090b0f");
scene.fog=new THREE.FogExp2("#090b0f",.014);

const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,120);
camera.position.set(0,4.8,11);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
world.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight("#fff5e8","#2a2023",1.45);
scene.add(hemi);
const sun=new THREE.DirectionalLight("#ffc083",2.7);
sun.position.set(6,10,4);
scene.add(sun);

const toon=(c)=>new THREE.MeshToonMaterial({color:c});
const root=new THREE.Group();
scene.add(root);

// Ground island
const island=new THREE.Mesh(new THREE.CylinderGeometry(7.4,.2,1.05,64),toon("#69804e"));
island.position.y=-.5;
root.add(island);
const soil=new THREE.Mesh(new THREE.CylinderGeometry(7.1,.25,.32,64),toon("#876b52"));
soil.position.y=-.02;
root.add(soil);

// Roads
const roadMat=toon("#554f4d");
function road(x,z,w,d,r=.2){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),roadMat);
 m.position.set(x,.17,z);m.rotation.y=r;root.add(m);return m;
}
road(0,0,12,.9,0);
road(0,0,.9,12,0);
road(-3.0,2.5,6,.65,-.55);
road(3.0,-2.6,6,.65,-.55);

// Building helper
function building(x,z,w,h,d,body,roof,label){
 const g=new THREE.Group();g.position.set(x,.2,z);
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),toon(body));b.position.y=h/2;g.add(b);
 const r=new THREE.Mesh(new THREE.ConeGeometry(Math.max(w,d)*.72,.7,4),toon(roof));r.position.y=h+.35;r.rotation.y=Math.PI/4;g.add(r);
 const door=new THREE.Mesh(new THREE.BoxGeometry(.42,.72,.06),toon("#27262a"));door.position.set(0,.36,d/2+.035);g.add(door);
 const sign=document.createElement("canvas");sign.width=320;sign.height=90;
 const ctx=sign.getContext("2d");ctx.fillStyle="#111218ee";ctx.beginPath();ctx.roundRect(8,10,304,70,18);ctx.fill();ctx.fillStyle="#ffbd83";ctx.font="700 25px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(label,160,45);
 const tex=new THREE.CanvasTexture(sign);tex.colorSpace=THREE.SRGBColorSpace;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));sp.scale.set(2.2,.62,1);sp.position.set(0,h+1.0,0);g.add(sp);
 root.add(g);return g;
}
const buildings=[
 {x:-4.3,z:-2.9,label:"CARE SCHEDULE",body:"#d59b72",roof:"#8f4b39",data:"care"},
 {x:4.1,z:-2.8,label:"JOURNAL AI",body:"#d8b06f",roof:"#915e3a",data:"journal"},
 {x:-4.1,z:2.9,label:"ANDROID LAB",body:"#c78467",roof:"#653f4c",data:"android"},
 {x:4.0,z:2.8,label:"RESEARCH",body:"#d0ba8a",roof:"#59677c",data:"research"},
 {x:0,z:4.5,label:"ARCHIVE",body:"#c8a16b",roof:"#594b50",data:"archive"},
 {x:0,z:-4.6,label:"GITHUB",body:"#b9b8b4",roof:"#34383f",data:"github"}
];
buildings.forEach(b=>building(b.x,b.z,1.8,1.55,1.7,b.body,b.roof,b.label));

const treeMat=toon("#315f40"),trunkMat=toon("#725039");
for(let i=0;i<48;i++){
 let a=Math.random()*Math.PI*2,r=5.1+Math.random()*1.5,x=Math.cos(a)*r,z=Math.sin(a)*r;
 const g=new THREE.Group();g.position.set(x,.22,z);
 const tr=new THREE.Mesh(new THREE.CylinderGeometry(.055,.075,.45,7),trunkMat);tr.position.y=.22;
 const cr=new THREE.Mesh(new THREE.ConeGeometry(.3,.7,8),treeMat);cr.position.y=.62;
 g.add(tr,cr);root.add(g);
}

// Fireflies / glitter
const pCount=1500;
const pPos=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){
 const a=Math.random()*Math.PI*2,r=7+Math.random()*5,y=-.1+Math.random()*5;
 pPos[i*3]=Math.cos(a)*r;
 pPos[i*3+1]=y;
 pPos[i*3+2]=Math.sin(a)*r;
}
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
const pts=new THREE.Points(pGeo,new THREE.PointsMaterial({color:"#ff8a45",size:.055,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(pts);

// Player
const player=new THREE.Group();
player.position.set(0,.22,0);
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.5,5,10),toon("#f0ece5"));torso.position.y=.62;
const head=new THREE.Mesh(new THREE.SphereGeometry(.22,18,14),toon("#d99572"));head.position.y=1.12;
const hair=new THREE.Mesh(new THREE.SphereGeometry(.23,18,10,0,Math.PI*2,0,Math.PI*.52),toon("#202126"));hair.position.y=1.18;
const shirtLogo=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.03),toon("#c55a39"));shirtLogo.position.set(0,.68,.24);
player.add(torso,head,hair,shirtLogo);
const legs=[];
for(const x of [-.1,.1]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.065,.35,4,8),toon("#313643"));l.position.set(x,.22,0);legs.push(l);player.add(l);}
const bag=new THREE.Mesh(new THREE.BoxGeometry(.28,.3,.15),toon("#a85039"));bag.position.set(.31,.73,-.09);player.add(bag);
root.add(player);

// NPC creation
const npcDefs=[
 {id:"guide",x:-1.7,z:.7,name:"Maya",role:"Guide",color:"#ebae78",dialog:["Welcome, traveler.","This little island is Vinith's portfolio.","Talk to the people around the village. They each guard a part of his story."]},
 {id:"engineer",x:-2.2,z:-1.3,name:"Arun",role:"Engineer",color:"#d67d59",dialog:["I build systems.","Ask me about CareSchedule and the engineering work behind it.","Six-layer architecture, APIs, workflows and scheduling logic."]},
 {id:"ai",x:2.0,z:-1.2,name:"Nia",role:"AI Builder",color:"#dda95e",dialog:["I live where code meets AI.","JournalAI is the next stop.","There is more than a chatbot in that project."]},
 {id:"android",x:-2.1,z:1.7,name:"Kiran",role:"Android Builder",color:"#be7568",dialog:["Small apps can still solve real problems.","Activities for Discord and WhatsApp Status Saver are over there.","Open source belongs in the world, not only in a repo."]},
 {id:"research",x:2.15,z:1.7,name:"Dr. Rao",role:"Researcher",color:"#c6a476",dialog:["Some roads lead to research.","The rehabilitation work is the research chapter.","Find the Research building for the paper story."]},
 {id:"archive",x:.9,z:3.1,name:"Ivy",role:"Archivist",color:"#b99769",dialog:["Every builder has an archive.","Education, technologies, interests and the timeline live here.","Take what you need and keep moving."]},
 {id:"contact",x:.8,z:-3.2,name:"Sam",role:"Courier Master",color:"#9e9fa4",dialog:["Need a direct line?","The GitHub house contains the open-source trail.","For contact, use the mail route in the small HUD above."]}
];

function makeNpc(n){
 const g=new THREE.Group();g.position.set(n.x,.22,n.z);g.userData=n;
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.23,.52,5,9),toon(n.color));body.position.y=.58;
 const head=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),toon("#d08e71"));head.position.y=1.05;
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.21,16,10,0,Math.PI*2,0,Math.PI*.5),toon("#25252a"));hair.position.y=1.11;
 g.add(body,head,hair);
 const c=document.createElement("canvas");c.width=300;c.height=76;const x=c.getContext("2d");
 x.fillStyle="#101217dd";x.beginPath();x.roundRect(5,7,290,62,18);x.fill();x.fillStyle="#f0ba86";x.font="700 22px system-ui";x.textAlign="center";x.textBaseline="middle";x.fillText(n.name+" · "+n.role,150,38);
 const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(2.0,.5,1);s.position.y=1.75;g.add(s);
 root.add(g);return g;
}
const npcs=npcDefs.map(makeNpc);

const content={
 care:{title:"CARE SCHEDULE",text:"Full-stack scheduling system built with ASP.NET Core, React, EF Core and SQL Server. The system includes 148 REST APIs, 32 controllers, 33 domain entities and six role-based workflows."},
 journal:{title:"JOURNAL AI",text:"AI journaling built with Next.js, Supabase and Groq AI, delivered through Docker, Kubernetes and Azure."},
 android:{title:"ANDROID LAB",text:"Activities for Discord uses Android, Java, C++, JNI and Discord's SDK. WhatsApp Status Saver is an open-source Kotlin Android utility available through F-Droid."},
 research:{title:"RESEARCH",text:"Multi-Task Graph Attention Network for Kinematic Rehabilitation Exercise Analysis, presented as an IEEE I3CTCON 2026 full paper."},
 archive:{title:"ARCHIVE",text:"Vinith Reddy Banda · Information Technology · CBIT. Builder focused on full-stack systems, developer tooling, AI and research."},
 github:{title:"GITHUB",text:"Open-source work, experiments and project repositories live here: github.com/vinithreddybanda"}
};

const panel=document.createElement("div");
panel.id="dialog";
panel.style.cssText="position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(16px);width:min(520px,calc(100% - 28px));padding:16px 18px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(12,14,18,.84);backdrop-filter:blur(24px);box-shadow:0 20px 80px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.32s ease;z-index:9;color:#f2f1ec";
panel.innerHTML='<div id="dialogRole" style="font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#ffab72"></div><div id="dialogTitle" style="font-size:22px;font-weight:750;letter-spacing:-.04em;margin:6px 0"></div><div id="dialogText" style="font-size:13px;line-height:1.6;color:#b5b6bd"></div><button id="nextDialog" style="margin-top:11px;padding:8px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;cursor:pointer">Continue ↗</button>';
document.body.appendChild(panel);

let activeNpc=null,dialogIndex=0;
const showNpc=(npc)=>{
 activeNpc=npc;dialogIndex=0;
 document.getElementById("dialogRole").textContent=npc.role;
 document.getElementById("dialogTitle").textContent=npc.name;
 document.getElementById("dialogText").textContent=npc.dialog[0];
 panel.style.opacity="1";panel.style.transform="translateX(-50%) translateY(0)";panel.style.pointerEvents="auto";
};
document.getElementById("nextDialog").onclick=()=>{
 if(!activeNpc)return;
 dialogIndex++;
 if(dialogIndex>=activeNpc.dialog.length){activeNpc=null;panel.style.opacity="0";panel.style.transform="translateX(-50%) translateY(16px)";panel.style.pointerEvents="none";return}
 document.getElementById("dialogText").textContent=activeNpc.dialog[dialogIndex];
};

let nearby=null;
function interact(){
 const p=player.position;
 let best=null,bd=1.45;
 for(const n of npcs){const d=n.position.distanceTo(p);if(d<bd){bd=d;best=n}}
 if(best){showNpc(best);return}
 for(const b of buildings){const d=Math.hypot(b.x-p.x,b.z-p.z);if(d<1.65){const c=content[b.data];if(c){document.getElementById("infoKicker").textContent="DISCOVERED";document.getElementById("infoTitle").textContent=c.title;document.getElementById("infoText").textContent=c.text;info.style.opacity="1";info.style.transform="translateY(0)";clearTimeout(info._t);info._t=setTimeout(()=>{info.style.opacity="0";info.style.transform="translateY(-8px)"},7000)}return}}
}

const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="e")interact()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let pointerX=0,pointerY=0;
addEventListener("pointermove",e=>{pointerX=e.clientX/innerWidth-.5;pointerY=e.clientY/innerHeight-.5},{passive:true});

let yaw=0,pitch=.18,drag=false,lastX=0,lastY=0;
addEventListener("mousedown",e=>{drag=true;lastX=e.clientX;lastY=e.clientY});
addEventListener("mouseup",()=>drag=false);
addEventListener("mousemove",e=>{if(!drag)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.005;pitch=THREE.MathUtils.clamp(pitch-dy*.004,-.15,.75)});

let touch=null;
addEventListener("touchstart",e=>{touch=e.touches[0]},{passive:true});
addEventListener("touchmove",e=>{if(!touch)return;const t=e.touches[0];const dx=t.clientX-touch.clientX,dy=t.clientY-touch.clientY;pointerX=THREE.MathUtils.clamp(pointerX+dx/innerWidth,-.5,.5);pointerY=THREE.MathUtils.clamp(pointerY+dy/innerHeight,-.5,.5);touch=t},{passive:true});
addEventListener("touchend",()=>touch=null,{passive:true});

const mobile=document.createElement("div");
mobile.id="mobileControls";
mobile.style.cssText="position:fixed;left:16px;bottom:64px;width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(18px);z-index:10;display:none";
mobile.innerHTML='<div style="position:absolute;left:34px;top:34px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08)"></div>';
document.body.appendChild(mobile);
const joystick={x:0,y:0,active:false};
mobile.addEventListener("touchstart",e=>{joystick.active=true;moveJoy(e.touches[0])},{passive:true});
mobile.addEventListener("touchmove",e=>moveJoy(e.touches[0]),{passive:true});
mobile.addEventListener("touchend",()=>{joystick.active=false;joystick.x=joystick.y=0},{passive:true});
function moveJoy(t){const r=mobile.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=t.clientX-cx,dy=t.clientY-cy;const l=Math.hypot(dx,dy),m=40;if(l>m){dx*=m/l;dy*=m/l}joystick.x=dx/m;joystick.y=dy/m}

let last=performance.now();
function game(){
 const now=performance.now()/1000;
 const dt=Math.min((performance.now()-last)/1000,.033);
 last=performance.now();
 let dx=0,dz=0;
 if(keys.w||keys.arrowup)dz-=1;
 if(keys.s||keys.arrowdown)dz+=1;
 if(keys.a||keys.arrowleft)dx-=1;
 if(keys.d||keys.arrowright)dx+=1;
 dx+=joystick.x;dz+=joystick.y;
 if(dx||dz){
  const l=Math.hypot(dx,dz);dx/=l;dz/=l;
  const c=Math.cos(yaw),s=Math.sin(yaw);
  const mx=dx*c-dz*s,mz=dx*s+dz*c;
  player.position.x+=mx*dt*2.25;
  player.position.z+=mz*dt*2.25;
  player.position.x=THREE.MathUtils.clamp(player.position.x,-6,6);
  player.position.z=THREE.MathUtils.clamp(player.position.z,-6,6);
  player.rotation.y=Math.atan2(mx,mz);
  legs[0].rotation.x=Math.sin(now*9)*.34;legs[1].rotation.x=-Math.sin(now*9)*.34;
  torso.rotation.z=Math.sin(now*9)*.035;
 }else{
  player.position.y=.22+Math.sin(now*1.7)*.018;
  torso.rotation.z=0;
 }
 npcs.forEach((n,i)=>{n.position.y=.22+Math.sin(now*1.2+i)*.02;n.rotation.y=Math.sin(now*.18+i)*.16});
 root.rotation.y=Math.sin(now*.035)*.04;
 pts.rotation.y+=dt*.004;

 // soft follow camera
 const camTarget=new THREE.Vector3(player.position.x,1.0,player.position.z);
 const desired=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*8.2+pointerX*1.5,
  player.position.y+4.1+pointerY*-1.2,
  player.position.z+Math.cos(yaw)*8.2
 );
 camera.position.lerp(desired,.055);
 camera.lookAt(camTarget);

 // Nearby interaction cue
 let near=null,dist=99;
 for(const n of npcs){const d=n.position.distanceTo(player.position);if(d<1.55&&d<dist){dist=d;near=n}}
 if(near!==nearby){
  nearby=near;
  if(near){tip.textContent="E · TALK TO "+near.name.toUpperCase();tip.style.opacity=".82"}else{tip.style.opacity="0"}
 }
 coords.textContent="SECTOR "+String(Math.round((player.position.x+6)/12*9+1)).padStart(2,"0")+" · "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
 renderer.render(scene,camera);
 requestAnimationFrame(game);
}
game();

addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6))});
if(matchMedia("(max-width:760px)").matches)mobile.style.display="block";
const interactionHint=document.createElement("div");interactionHint.className="interaction";interactionHint.textContent=matchMedia("(max-width:760px)").matches?"TOUCH · MOVE · EXPLORE":"WASD · MOUSE · E";document.body.appendChild(interactionHint);
</script>
</body>
</html>
