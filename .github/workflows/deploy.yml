name: Build and deploy Morrowvale
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify JavaScript modules
        run: |
          node --check game.js
          for file in src/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Verify model library and game data
        run: npm test
      - name: Verify static game shell
        run: |
          test -s index.html
          test -s style.css
          test -s game.js
          test "$(find assets/models -name '*.glb' | wc -l)" -ge 20
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
