name: Build and deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify JavaScript
        run: node --check app.js && node --check scripts/verify-portfolio.mjs
      - name: Verify portfolio structure and interactions
        run: npm test
      - name: Verify static files
        run: |
          test -s index.html
          test -s style.css
          test -s app.js
          test -s favicon.svg
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
